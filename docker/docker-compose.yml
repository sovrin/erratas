services:
  database:
    build:
      context: .
      dockerfile: pocketbase.Dockerfile
    container_name: database
    restart: unless-stopped
    ports:
      - '127.0.0.1:8090:8090'
    environment:
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    volumes:
      - erratas_data:/pb_data
      - ./pocketbase/public:/pb_public
      - ./pocketbase/hooks:/pb_hooks
      - ./pocketbase/migrations:/pb_migrations
      - ../shared/pocketbase:/pb_static
    entrypoint: ['/pb/pocketbase']
    command:
      - serve
      - --http=0.0.0.0:8090
      - --dir=/pb_data
      - --publicDir=/pb_public
      - --hooksDir=/pb_hooks
      - --migrationsDir=/pb_migrations

volumes:
  erratas_data:
    name: erratas_data
